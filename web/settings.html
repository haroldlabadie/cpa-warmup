<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPA 定向预热</title><style>
body{font:16px system-ui;max-width:1150px;margin:2rem auto;padding:1rem;background:#f5f7fa;color:#17212f}section{background:white;border-radius:12px;padding:1.4rem;margin:1rem 0}label{display:block;margin:.8rem 0}button,input,select{font:inherit;padding:.5rem}input[type=text]{min-width:20rem}input[type=checkbox]{min-width:0}select{min-width:22rem;min-height:7rem}button{margin:.4rem .4rem .4rem 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:.6rem;overflow-wrap:anywhere}small{color:#536270}.banner{padding:.8rem;background:#edf3ff}#message{min-height:1.5rem;color:#9a3000}.muted{color:#536270}
</style><h1>定向预热 <small id="version"></small></h1><p class="muted">按账号与模型族启动用量窗口。未知结果保留未决，停止预热不会改变凭证的启用状态。</p>
<section><label id="authLabel">管理令牌 <input id="token" type="password" autocomplete="off" placeholder="仅保留在本页内存"></label><button id="load">连接并加载</button><span id="message" role="status"></span></section>
<section><h2>预热计划</h2><fieldset id="form" disabled><label><input id="enabled" type="checkbox"> 启用自动预热</label><label>每天执行时间（小时，逗号分隔） <input id="hours" type="text" placeholder="5,10,15,20"></label><p class="muted">时区为上海。每个时点最多等待 90 分钟，真实旧周期结束后再等 15 秒；不追补已过期的槽位。</p><label>Codex 模型 <input id="codex" type="text"></label><label>Gemini 模型 <input id="gemini" type="text"></label><label>Claude / GPT 模型 <input id="third_party" type="text"></label><label><input id="allAccounts" type="checkbox"> 覆盖全部支持的账号</label><label>指定账号（可多选）<br><select id="accounts" multiple aria-label="指定预热账号"></select></label><button id="save" type="button">保存计划</button></fieldset></section>
<section><h2>运行状态</h2><p id="health" class="banner">请连接管理会话。</p><p id="next"></p><p id="error"></p><table><thead><tr><th>槽位</th><th>账号 / 模型族</th><th>状态</th><th>原因</th><th>尝试</th><th>周期截止</th></tr></thead><tbody id="rows"></tbody></table></section><script>/*SETTINGS_JS*/</script></html>
